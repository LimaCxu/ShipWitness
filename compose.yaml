services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipwitness
      POSTGRES_USER: shipwitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - shipwitness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipwitness -d shipwitness"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  shipwitness:
    build: .
    image: ${SHIPWITNESS_IMAGE:-shipwitness:0.4.0-dev.37}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shipwitness:${POSTGRES_PASSWORD}@postgres:5432/shipwitness
      SHIPWITNESS_ARTIFACTS_DIR: /app/data/evidence
      SHIPWITNESS_MASTER_KEY: ${SHIPWITNESS_MASTER_KEY:?Set SHIPWITNESS_MASTER_KEY in .env}
      SHIPWITNESS_ALLOWED_TARGET_ORIGINS: ${SHIPWITNESS_ALLOWED_TARGET_ORIGINS:-}
      SHIPWITNESS_PUBLIC_URL: ${SHIPWITNESS_PUBLIC_URL:-}
      SHIPWITNESS_SMTP_HOST: ${SHIPWITNESS_SMTP_HOST:-}
      SHIPWITNESS_SMTP_PORT: ${SHIPWITNESS_SMTP_PORT:-587}
      SHIPWITNESS_SMTP_SECURE: ${SHIPWITNESS_SMTP_SECURE:-false}
      SHIPWITNESS_SMTP_REQUIRE_TLS: ${SHIPWITNESS_SMTP_REQUIRE_TLS:-true}
      SHIPWITNESS_SMTP_FROM: ${SHIPWITNESS_SMTP_FROM:-}
      SHIPWITNESS_SMTP_USER: ${SHIPWITNESS_SMTP_USER:-}
      SHIPWITNESS_SMTP_PASSWORD: ${SHIPWITNESS_SMTP_PASSWORD:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SHIPWITNESS_GITHUB_WEBHOOK_SECRET: ${SHIPWITNESS_GITHUB_WEBHOOK_SECRET:-}
      SHIPWITNESS_SECURITY_REVIEW_REFERENCE: ${SHIPWITNESS_SECURITY_REVIEW_REFERENCE:-}
      SHIPWITNESS_SECURITY_REVIEWED_AT: ${SHIPWITNESS_SECURITY_REVIEWED_AT:-}
      SHIPWITNESS_RELEASED_AT: ${SHIPWITNESS_RELEASED_AT:-}
      SHIPWITNESS_END_OF_SUPPORT_AT: ${SHIPWITNESS_END_OF_SUPPORT_AT:-}
    ports:
      - "4173:4173"
    volumes:
      - shipwitness-data:/app/data
    restart: unless-stopped

volumes:
  shipwitness-data:
  shipwitness-postgres:
