name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shipwitness_test
          POSTGRES_USER: shipwitness
          POSTGRES_PASSWORD: shipwitness-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipwitness -d shipwitness_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://shipwitness:shipwitness-ci-password@127.0.0.1:5432/shipwitness_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run security:audit
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run smoke:self
